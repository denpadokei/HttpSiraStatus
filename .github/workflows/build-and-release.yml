name: Build and Release

# One repository, two game versions. `versions.json` is the single source of
# truth: it maps each game version to the plugin version and dependencies, and
# the plugin version is also the release tag. Consequently:
#   1.40.8 -> tag 14.2.0
#   1.44.1 -> tag 16.0.0
# Push the tag for the version you want to release. Pull requests and branch
# pushes build both versions but never create a release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - 'HttpSiraStatus/**'
      - 'versions.json'
      - 'scripts/**'
  push:
    branches: [master]
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      is-release: ${{ steps.versions.outputs.is-release }}
      game-version: ${{ steps.versions.outputs.game-version }}
      mod-version: ${{ steps.versions.outputs.mod-version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: pwsh
        run: ./scripts/prepare-versions.ps1

  build:
    name: Build ${{ matrix.game_version }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare manifest
        shell: pwsh
        run: ./scripts/prepare-manifest.ps1 -GameVersion '${{ matrix.game_version }}'

      # The action installs the game version and the dependencies from
      # versions.json. Keep the dependency versions in the manifest and here in
      # sync via the matrix values.
      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}\HttpSiraStatus\HttpSiraStatus.csproj
          game-version: ${{ matrix.game_version }}
          additional-dependencies: |
            {
              "BSIPA": "${{ matrix.bsipa }}",
              "SiraUtil": "${{ matrix.sirautil }}"
            }

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build "${{ github.workspace }}\HttpSiraStatus\HttpSiraStatus.csproj" -c Release `
            -p:Version=${{ matrix.mod_version }} `
            -p:BeatSaberDir="$env:BeatSaberDir" `
            -p:GameDirectory="$env:BeatSaberDir" `
            -p:LocalRefsDir="$env:BeatSaberDir" `
            -p:DisableCopyToPlugins=true

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $artifact = Get-ChildItem '${{ github.workspace }}\HttpSiraStatus\bin\Release' -Recurse -Directory -Filter Artifact -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $artifact) { throw 'BeatSaberModdingTools did not produce an Artifact directory under bin\Release.' }

          $name = 'HttpSiraStatus-${{ matrix.mod_version }}-bs${{ matrix.game_version }}'
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path (Join-Path $artifact.FullName '*') -DestinationPath $zip -Force

          "zip-path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip-name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Package: $zip"
          Get-ChildItem $artifact.FullName -Recurse -File | ForEach-Object { Write-Host "  " $_.FullName.Substring($artifact.FullName.Length + 1) }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip-name }}
          path: ${{ steps.package.outputs.zip-path }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v7
        with:
          name: HttpSiraStatus-${{ needs.prepare.outputs.mod-version }}-bs${{ needs.prepare.outputs.game-version }}
          path: release

      - name: Attach artifact and set release name
        shell: bash
        run: |
          repo='${{ github.repository }}'
          tag='${{ github.ref_name }}'
          version='${{ needs.prepare.outputs.mod-version }}'
          game='${{ needs.prepare.outputs.game-version }}'
          release_name="HttpSiraStatus-${version}-bs${game}"
          zip="release/${release_name}.zip"
          sha='${{ github.sha }}'
          notes="${release_name} ($(printf '%s' "$sha" | cut -c1-7))."

          if [ ! -f "$zip" ]; then
            echo "::error::release asset '$zip' not found"; exit 1
          fi

          pre=()
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            pre=(--prerelease --latest=false)
          fi

          # The tag is created by hand; verify it still points at this commit.
          tag_sha=$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null || true)
          if ! [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            tag_sha=""
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$sha" ]; then
            echo "::warning::tag '$tag' points to $tag_sha but this run built $sha; skipping release."
            exit 0
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title "$release_name" "${pre[@]}"
          else
            gh release create "$tag" --repo "$repo" --title "$release_name" --notes "$notes" --verify-tag "${pre[@]}"
          fi
          gh release upload "$tag" "$zip" --repo "$repo" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
